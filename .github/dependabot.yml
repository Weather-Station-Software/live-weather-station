# Dependabot version updates. Security alerts and security updates are enabled in the repository settings.
version: 2
updates:
  # GitHub Actions used by the CI and release workflows (pinned by commit SHA: Dependabot updates the SHA and its version comment).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
  # Composer (development tools only): add this block once a development-only composer.json exists.
  # - package-ecosystem: "composer"
